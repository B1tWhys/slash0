[package]
name = "ris_client"
version.workspace = true
edition.workspace = true

[dependencies]
slash0-core = { workspace = true, features = ["alloc", "serde", "parse"] }
serde = "1.0.229"
serde_json = "1.0.151"
anyhow = "1.0.104"
futures = "0.3.33"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
metrics = "0.24.6"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5.8"

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
