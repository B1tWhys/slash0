[package]
name = "slash0-client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
slash0-core = { path = "../core", features = ["alloc", "serde", "gpu"] }
bytemuck = { version = "1", default-features = false }
hashbrown = "0.17.1"
wgpu = { version = "30.0.0", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "console", "Performance"] }
console_log = "1.0"
log = "0.4"
gloo-net = { version = "0.7.0", default-features = true }
anyhow = "1.0.104"
futures = "0.3.33"
postcard = { version = "1.1.3", features = ["alloc"] }
thiserror = "2.0.20"

[build-dependencies]
spirv-builder = "0.10.0-alpha.1"
naga = { version = "30.0.0", features = ["spv-in", "wgsl-out"] }
