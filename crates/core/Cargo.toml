[package]
name = "slash0-core"
version.workspace = true
edition.workspace = true

[features]
default = ["alloc"]
alloc = ["dep:hashbrown"]
thick = ["alloc"]
serde = ["dep:serde", "bitflags/serde"]
# CIDR-string parsing on the CPU. Pulls in a data-carrying error enum that
# rust-gpu can't lower, so the shader (default-features = false) leaves it off.
parse = ["dep:thiserror"]

[lints.rust]
# The main rust tooling doesn't (yet) know about the spriv target, so the linter complains about
# an unknown cfg value unless we tell it about spirv explicitly
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }

[dependencies]
bitflags = { version = "2", default-features = false }
hashbrown = { version = "0.17.1", optional = true }
macro_rules_attribute = "0.2.3"
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
thiserror = { version = "2.0.19", default-features = false, optional = true }
