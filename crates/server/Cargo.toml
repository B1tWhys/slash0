[package]
name = "slash0-server"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["tokio", "ws"] }
bgpkit-parser = { version = "0.18.0", default-features = false, features = ["parser"]}
clap = { version = "4.6.4", features = ["derive"] }
figment = { version = "0.10.19", features = ["yaml"] }
futures = "0.3.33"
ipnet = "2.12.0"
macro_rules_attribute = "0.2.3"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
oneio = { version = "0.24.2", default-features = false, features = ["gz"] }
postcard = { version = "1.1.3", features = ["alloc"] }
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "rustls", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slash0-core = { workspace = true, features = ["alloc", "thick", "serde", "parse"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["codec", "io"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
