[package]
name = "mrt-util-cli"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
bgpkit-parser = { version = "0.19.0", features = ["serde", "serde_json", "parser"], default-features = false}
clap = { version = "4.6.4", features = ["derive"] }
flate2 = "1.1.9"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["alloc"] }
serde_json = { version = "1.0.151", features = ["alloc"] }
