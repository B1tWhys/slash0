# slash0 server configuration.
#
# Every value below is also the built-in default, so this file is optional:
# with no config present the server runs on these settings. Copy this to
# config/server.yaml (the path used when --config is omitted) or point at it
# explicitly with `--config path/to/file.yaml`, then edit what you need.

server:
  host: 127.0.0.1
  http_port: 3000
  # Directory served for non-API, non-websocket requests. Relative to the
  # working directory (the workspace root under `cargo run`).
  assets_dir: crates/client/dist

  # TLS via Let's Encrypt. Commented out because the defaults above are what a
  # local `cargo run` uses, and Let's Encrypt cannot validate localhost: it
  # fetches the challenge over plain HTTP on port 80 at each domain below.
  # tls_config:
  #   https_port: 3001
  #   lets_encrypt:
  #     domains:
  #       - slash0.dev
  #     # Holds the ACME account key and the certificate. Must persist across
  #     # restarts, or every boot orders a new certificate.
  #     certs_dir: ./certs
  #     # The staging directory's rate limits are much harder to hit, at the cost
  #     # of a certificate browsers do not trust. Flip to true once an order is
  #     # seen to succeed against staging.
  #     prod_letsencrypt: false

logging:
  # tracing EnvFilter directive.
  filter: "info,slash0=debug,tower_http=debug"

ris:
  # RIS Live route collector (RRC) to consume from. Every peer that collector
  # sees is ingested (announcements and withdrawals both).
  host: rrc00.ripe.net
  # Seed the trie with data from an RIS data dump file. Can be a URL, but server
  # startup will be way faster with a file. File can be gzip'd. Optional,
  # if omitted the server isn't seeded and accumulates routes slooowly
  # from RIS live alone.
  #
  # Download files from: https://ris.ripe.net/docs/mrt/
  # seed_file: ./bview.20260725.0000.gz
