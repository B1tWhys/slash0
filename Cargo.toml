[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/mrt-util-cli",
    "crates/ris_client",
    "crates/server",
]
exclude = [
    "crates/client",
    "crates/shader",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
slash0-core = { path = "crates/core", default-features = false }
ris_client = { path = "crates/ris_client", default-features = false }
